        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: #f8fafc; 
            padding-bottom: 220px; 
            margin: 0;
        }
        /* شبكة المنتجات: منتجين في كل سطر */
        .strict-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            padding: 0 12px; 
            max-width: 800px;
            margin: 0 auto;
        }
        .item-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        /* تصميم مربع نوع الصنف البديل للصور */
        .item-category-banner {
            width: 100%;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            font-weight: 900;
            border-bottom: 1px solid #f1f5f9;
            text-align: center;
        }
        .cart-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-top: 1px solid #e5e7eb;
            padding: 16px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
            z-index: 50;
        }
        .category-header {
            max-width: 800px;
            margin: 24px auto 16px auto;
            padding: 0 12px;
        }
    </style>

        let globalProductId = 0;
        const productsMap = {};
        const cart = {};

        // بناء واجهة الأقسام
        function renderCategories() {
            const container = document.getElementById('categories-container');
            let htmlContent = '';

            categoriesData.forEach(category => {
                htmlContent += `
                    <div class="mb-10">
                        <div class="category-header">
                            <h2 class="text-xl font-bold bg-[#1e3a8a] text-white p-3 rounded-xl shadow-sm border-r-4 border-[#facc15]">${category.title}</h2>
                        </div>
                        <div class="strict-grid">
                `;

                category.items.forEach(itemArr => {
                    globalProductId++;
                    const pId = globalProductId;
                    const pName = itemArr[0];
                    const pPrice = itemArr[1];
                    
                    productsMap[pId] = { name: pName, price: pPrice };

                    htmlContent += `
                        <div class="item-card">
                            <div class="item-category-banner ${category.bgColor} ${category.textColor}">
                                ${category.label}
                            </div>
                            <div class="p-3 flex flex-col justify-between flex-grow gap-3">
                                <h3 class="text-[13px] sm:text-[15px] font-bold text-gray-800 leading-snug line-clamp-3 min-h-[3rem]">${pName}</h3>
                                <div>
                                    <div class="text-[#16a34a] font-black text-[15px] sm:text-lg mb-3" dir="ltr">${pPrice.toFixed(2)} €</div>
                                    <div class="flex items-center justify-between bg-gray-50 border rounded-lg p-1.5 shadow-inner">
                                        <button onclick="changeQty(${pId}, 1)" class="w-9 h-9 bg-[#1e3a8a] text-white rounded-md text-xl font-bold flex items-center justify-center hover:bg-blue-800 active:scale-90">+</button>
                                        <span id="qty-${pId}" class="font-bold text-gray-800 text-base w-8 text-center">0</span>
                                        <button onclick="changeQty(${pId}, -1)" class="w-9 h-9 bg-red-100 text-red-600 rounded-md text-xl font-bold flex items-center justify-center hover:bg-red-200 active:scale-90">-</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                htmlContent += `
                        </div>
                    </div>
                `;
            });

            container.innerHTML = htmlContent;
        }

        // تحديث الكمية
        function changeQty(id, change) {
            cart[id] = (cart[id] || 0) + change;
            if (cart[id] < 0) cart[id] = 0;
            document.getElementById(`qty-${id}`).innerText = cart[id];
            calculateTotal();
        }

        // حساب الإجمالي
        function calculateTotal() {
            let total = 0;
            for (let id in cart) {
                if (cart[id] > 0) {
                    total += cart[id] * productsMap[id].price;
                }
            }
            document.getElementById('total-price').innerText = total.toFixed(2) + ' €';
        }

        // نوافذ التنبيه
        function showModal(msg) {
            document.getElementById('modal-msg').innerText = msg;
            document.getElementById('modal').classList.remove('hidden');
        }
        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        // حفظ كقائمة مشتريات (واتساب عام)
        function saveShoppingList() {
            let orderItems = '';
            let total = 0;
            let hasItems = false;

            for (let id in cart) {
                if (cart[id] > 0) {
                    hasItems = true;
                    const prod = productsMap[id];
                    const subtotal = cart[id] * prod.price;
                    total += subtotal;
                    orderItems += `- ${cart[id]}x ${prod.name} (${subtotal.toFixed(2)}€)\n`;
                }
            }

            if (!hasItems) {
                showModal('قائمة المشتريات فارغة. الرجاء اختيار العروض التي ترغب بتسجيلها أولاً!');
                return;
            }

            const text = `قائمة مشترياتي من ماركت النجوم:\n${orderItems}المجموع: ${total.toFixed(2)}€`;
            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        window.onload = renderCategories;
